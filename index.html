<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard ôn thi — HOD402 · HOD401 · CES202 · IAP301</title>
<style>
:root, :root[data-theme="dark"]{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c232d;--border:#30363d;--text:#e6edf3;--muted:#9aa7b4;
  --accent:#3b82f6;--accent2:#2563eb;--chip:#21262d;--topbar:rgba(13,17,23,.96);--shadow:rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f6f8fa;--panel:#fff;--panel2:#eef1f4;--border:#d0d7de;--text:#1f2328;--muted:#59636e;
  --accent:#2563eb;--accent2:#1d4ed8;--chip:#eaeef2;--topbar:rgba(255,255,255,.94);--shadow:rgba(140,149,159,.28);
}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;transition:background .2s,color .2s}
header{background:var(--topbar);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:0 0 auto}
.brand{font-weight:800;font-size:1.15rem;white-space:nowrap}.brand .em{margin-right:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:999px;
  padding:8px 16px;font-size:.92rem;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--accent)}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grow{flex:1}
.theme-btn{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.theme-btn:hover{background:var(--panel2)}
#content{flex:1;min-height:0;position:relative;overflow:hidden}
.panel{position:absolute;inset:0;display:none}.panel.active{display:block}
.panel iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.loading{position:absolute;inset:0;background:var(--bg);z-index:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
@media(max-width:560px){
  header{padding:8px 12px;gap:8px;row-gap:8px}
  .brand{order:1;font-size:1rem}
  .grow{order:2}
  .theme-btn{order:3}
  /* tabs get their own row and scroll horizontally instead of wrapping to 2-3 rows */
  .tabs{order:4;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
        scrollbar-width:none;-ms-overflow-style:none;margin:0 -12px;padding:2px 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 14px;font-size:.85rem;min-height:40px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="em">📚</span>Dashboard ôn thi</div>
  <div class="tabs">
    <button class="tab" data-tab="hod402" onclick="selectTab('hod402')">HOD402 - ITexam</button>
    <button class="tab" data-tab="hodfu" onclick="selectTab('hodfu')">HOD402 - FU</button>
    <button class="tab" data-tab="hod401" onclick="selectTab('hod401')">HOD401</button>
    <button class="tab" data-tab="ces202" onclick="selectTab('ces202')">CES202</button>
    <button class="tab" data-tab="iap301" onclick="selectTab('iap301')">IAP301</button>
    <button class="tab" data-tab="frs401c" onclick="selectTab('frs401c')">FRS401C</button>
  </div>
  <div class="grow"></div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ Sáng</button>
</header>

<div id="content">
  <div class="panel" id="panel-hod402"><iframe title="HOD402 ITexam" data-src="hod402.html"></iframe><div class="loading">Đang tải…</div></div>
  <div class="panel" id="panel-hodfu"><iframe title="HOD402 FU"  data-src="onthi-fu.html?subject=HOD402"></iframe><div class="loading">Đang tải…</div></div>
  <div class="panel" id="panel-hod401"><iframe title="HOD401"    data-src="onthi-fu.html?subject=HOD401"></iframe><div class="loading">Đang tải…</div></div>
  <div class="panel" id="panel-ces202"><iframe title="CES202"    data-src="onthi-fu.html?subject=CES202"></iframe><div class="loading">Đang tải…</div></div>
  <div class="panel" id="panel-iap301"><iframe title="IAP301"    data-src="onthi-fu.html?subject=IAP301"></iframe><div class="loading">Đang tải…</div></div>
  <div class="panel" id="panel-frs401c"><iframe title="FRS401C" data-src="onthi-fu.html?subject=FRS401C"></iframe><div class="loading">Đang tải…</div></div>
</div>

<script>
function el(id){return document.getElementById(id)}
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('app_theme',t)}catch(e){}
  const b=el('themeBtn');if(b)b.textContent=t==='dark'?'☀️ Sáng':'🌙 Tối';}
function toggleTheme(){applyTheme((document.documentElement.dataset.theme||'dark')==='dark'?'light':'dark')}
(function(){let t;try{t=localStorage.getItem('app_theme')}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';applyTheme(t)})();

const TABS=['hod402','hodfu','hod401','ces202','iap301','frs401c'];
function selectTab(name){
  if(!TABS.includes(name))name='hod402';
  TABS.forEach(t=>{
    const p=el('panel-'+t), active=(t===name);
    p.classList.toggle('active',active);
    document.querySelector('.tab[data-tab="'+t+'"]').classList.toggle('active',active);
    if(active){ const f=p.querySelector('iframe[data-src]');
      if(f && !f.getAttribute('src')){ f.addEventListener('load',()=>{const l=p.querySelector('.loading'); if(l) l.style.display='none';},{once:true});
        f.setAttribute('src',f.getAttribute('data-src')); } }
  });
  try{localStorage.setItem('dash_tab',name)}catch(e){}
}
(function(){let t;try{t=localStorage.getItem('dash_tab')}catch(e){}selectTab(t||'hod402')})();
</script>
</body>
</html>
